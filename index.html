<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using by JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="calculator">
            <form>
                <div class="display">
                    <input type="text" name="display">
                </div>
                <div>
                    <input type="button" value="AC" onclick="display.value = '' " class="operator">
                    <input type="button" value="DE" onclick="display.value = display.value.toString().slice(0,-1)" class="operator">
                    <input type="button" value="." onclick="display.value += '.' " class="operator">
                    <input type="button" value="/" onclick="display.value += '/' " class="operator">
                </div>
                <div>
                    <input type="button" value="7" onclick="display.value += '7' ">
                    <input type="button" value="8" onclick="display.value += '8' ">
                    <input type="button" value="9" onclick="display.value += '9' ">
                    <input type="button" value="*" onclick="display.value += '*' " class="operator">
                </div>
                <div>
                    <input type="button" value="4" onclick="display.value += '4' ">
                    <input type="button" value="5" onclick="display.value += '5' ">
                    <input type="button" value="6" onclick="display.value += '6' ">
                    <input type="button" value="-" onclick="display.value += '-' " class="operator">
                </div>
                <div>
                    <input type="button" value="1" onclick="display.value += '1' ">
                    <input type="button" value="2" onclick="display.value += '2' ">
                    <input type="button" value="3" onclick="display.value += '3' ">
                    <input type="button" value="+" onclick="display.value += '+' " class="operator">
                </div>
                <div>
                    <input type="button" value="00" onclick="display.value += '00' ">
                    <input type="button" value="0" onclick="display.value += '0' ">
                    <input type="button" value="=" onclick="display.value = eval(display.value)"class="equal operator">
                </div>
            </form>
        </div>
    </div>

    <script>
let display = document.getElementById("display");
let buttons = document.querySelectorAll("input[type='button']");

let currentInput = "";

buttons.forEach(button => {
    button.addEventListener("click", () => {
        let value = button.value;

        if (value === "AC") {
            currentInput = "";
            display.value = "";
        } 
        else if (value === "DE") {
            currentInput = currentInput.slice(0, -1);
            display.value = currentInput;
        } 
        else if (value === "=") {
            try {
                currentInput = calculate(currentInput);
                display.value = currentInput;
            } catch {
                display.value = "Error";
                currentInput = "";
            }
        } 
        else {
            currentInput += value;
            display.value = currentInput;
        }
    });
});

// Calculator Logic (No eval)
function calculate(expression) {
    let numbers = expression.split(/[\+\-\*\/]/).map(Number);
    let operators = expression.match(/[\+\-\*\/]/g);

    if (!operators) return numbers[0];

    let result = numbers[0];

    for (let i = 0; i < operators.length; i++) {
        let nextNum = numbers[i + 1];

        switch (operators[i]) {
            case "+":
                result += nextNum;
                break;
            case "-":
                result -= nextNum;
                break;
            case "*":
                result *= nextNum;
                break;
            case "/":
                result /= nextNum;
                break;
        }
    }
    return result;
}
</script>

</body>
</html>
